services:
  # ---- Main lab node (steps 00-03, 05, 06, 07) ----
  pg-primary:
    image: postgres:16
    container_name: pg-primary
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: shop
    ports: ["5432:5432"]
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c shared_buffers=256MB
      -c work_mem=4MB
      -c effective_cache_size=768MB
      -c random_page_cost=4.0
      -c max_parallel_workers_per_gather=0
      -c log_min_duration_statement=200
    volumes:
      - pgprimary:/var/lib/postgresql/data
      - ./:/lab:ro
    shm_size: 512mb

  # ---- Read replicas (step 04) ----
  pg-replica1:
    image: postgres:16
    container_name: pg-replica1
    environment:
      POSTGRES_PASSWORD: lab
    ports: ["5433:5432"]
    depends_on: [pg-primary]
    user: postgres
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until pg_isready -h pg-primary -U postgres; do sleep 1; done
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          rm -rf /var/lib/postgresql/data/*
          PGPASSWORD=lab pg_basebackup -h pg-primary -U postgres \
            -D /var/lib/postgresql/data -Fp -Xs -P -R \
            -S replica1 -C
        fi
        exec postgres -c hot_standby=on -c hot_standby_feedback=on
    volumes:
      - pgreplica1:/var/lib/postgresql/data

  pg-replica2:
    image: postgres:16
    container_name: pg-replica2
    environment:
      POSTGRES_PASSWORD: lab
    ports: ["5434:5432"]
    depends_on: [pg-primary]
    user: postgres
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until pg_isready -h pg-primary -U postgres; do sleep 1; done
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          rm -rf /var/lib/postgresql/data/*
          PGPASSWORD=lab pg_basebackup -h pg-primary -U postgres \
            -D /var/lib/postgresql/data -Fp -Xs -P -R \
            -S replica2 -C
        fi
        exec postgres -c hot_standby=on -c hot_standby_feedback=on
    volumes:
      - pgreplica2:/var/lib/postgresql/data

  # ---- Shard nodes (step 05, cross-node section) ----
  pg-shard0:
    image: postgres:16
    container_name: pg-shard0
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: shard0
    ports: ["5440:5432"]
    volumes: [pgshard0:/var/lib/postgresql/data]

  pg-shard1:
    image: postgres:16
    container_name: pg-shard1
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: shard1
    ports: ["5441:5432"]
    volumes: [pgshard1:/var/lib/postgresql/data]

volumes:
  pgprimary:
  pgreplica1:
  pgreplica2:
  pgshard0:
  pgshard1:
